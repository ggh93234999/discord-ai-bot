    <circle cx="86" cy="264" r="7" fill="#1a1814"/>
  </g>
  <g filter="url(#rough)" fill="#b3261e" opacity="0.85">
    <circle cx="560" cy="120" r="3.2"/><circle cx="578" cy="96" r="2.2"/><circle cx="548" cy="74" r="2.6"/><circle cx="596" cy="142" r="1.8"/><circle cx="530" cy="150" r="2"/>
  </g>
  <g filter="url(#rough)" fill="#1a1814" opacity="0.7">
    <circle cx="520" cy="100" r="2.4"/><circle cx="600" cy="70" r="1.8"/><circle cx="505" cy="132" r="1.6"/>
  </g>
  <g transform="translate(836 188)" filter="url(#rough)">
