    <path d="M82 6 L86 6 L86 196 L82 196Z" fill="#c9c4b4" opacity="0.4"/>
    <rect x="46" y="206" width="76" height="9" rx="3" fill="#1a1814"/>
    <rect x="80" y="214" width="12" height="46" rx="3" fill="#2a2218"/>
