    <path d="M820 36 l-34 -14 M800 44 l-30 14 M770 52 l-26 -14 M742 64 l-20 12 M860 30 l-18 -20" stroke-width="2.4"/>
  </g>
  <g filter="url(#rough)" fill="#1a1814" opacity="0.9">
    <circle cx="786" cy="22" r="6"/><circle cx="765" cy="60" r="5"/><circle cx="735" cy="78" r="4"/><circle cx="842" cy="12" r="5"/>
  </g>
