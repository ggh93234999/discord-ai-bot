<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.33  0 0 0 0.16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <filter id="wash" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26"/>
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8d4"/><stop offset="1" stop-color="#d9cfb4"/></linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15130f"/><stop offset="0.5" stop-color="#3a3731"/><stop offset="1" stop-color="#0e0d0b"/></linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#efe8d4" stop-opacity="0.92"/><stop offset="0.5" stop-color="#efe8d4" stop-opacity="0.55"/><stop offset="1" stop-color="#efe8d4" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="900" height="260" fill="url(#sky)"/>
  <rect width="900" height="260" fill="#fff" filter="url(#paper)"/>
  <circle cx="735" cy="78" r="46" fill="#b3261e" opacity="0.78" filter="url(#blur2)"/>
  <g filter="url(#wash)">
    <path d="M-40 190 L60 120 L130 160 L210 90 L290 150 L350 120 L440 185 L440 270 L-40 270Z" fill="#8a8c88" opacity="0.38"/>
    <path d="M360 200 L470 110 L540 150 L620 70 L700 140 L780 100 L940 190 L940 270 L360 270Z" fill="#6d706c" opacity="0.5"/>
    <path d="M-40 230 L90 170 L190 205 L300 160 L420 215 L560 175 L700 220 L820 185 L940 235 L940 280 L-40 280Z" fill="#33352f" opacity="0.62"/>
  </g>
  <g filter="url(#soft)" fill="#f3eddc">
    <ellipse cx="250" cy="170" rx="190" ry="20" opacity="0.75"/>
    <ellipse cx="640" cy="190" rx="220" ry="18" opacity="0.7"/>
    <ellipse cx="450" cy="215" rx="300" ry="14" opacity="0.6"/>
  </g>
  <rect width="900" height="260" fill="url(#fadeL)"/>
  <g filter="url(#rough)" stroke="#1a1814" stroke-linecap="round" fill="none">
